name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/appslist
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AppsList'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.example.appslist'
            compileSdk 34
            defaultConfig {
              applicationId 'com.example.appslist'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <application android:label="Apps List"
                android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/appslist/MainActivity.kt <<'EOF'
          package com.example.appslist

          import android.app.Activity
          import android.os.Bundle
          import android.view.*
          import android.widget.*

          class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val root = LinearLayout(this)
              root.orientation = LinearLayout.VERTICAL
              root.setPadding(32, 100, 32, 32)

              val btn = Button(this)
              btn.text = "Installed apps"
              val bigIcon = ImageView(this)
              bigIcon.layoutParams = LinearLayout.LayoutParams(300, 300)
              val label = TextView(this)
              label.textSize = 20f
              val list = ListView(this)

              root.addView(btn)
              root.addView(bigIcon)
              root.addView(label)
              root.addView(list)
              setContentView(root)

              btn.setOnClickListener {
                val pm = packageManager
                val apps = pm.getInstalledApplications(0)
                  .filter { pm.getLaunchIntentForPackage(it.packageName) != null }
                  .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }

                list.adapter = object : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(p: Int) = apps[p]
                  override fun getItemId(p: Int) = p.toLong()
                  override fun getView(p: Int, v: View?, parent: ViewGroup): View {
                    val row = LinearLayout(this@MainActivity)
                    row.orientation = LinearLayout.HORIZONTAL
                    row.gravity = Gravity.CENTER_VERTICAL
                    row.setPadding(8, 16, 8, 16)
                    val img = ImageView(this@MainActivity)
                    img.layoutParams = LinearLayout.LayoutParams(120, 120)
                    img.setImageDrawable(pm.getApplicationIcon(apps[p]))
                    val tv = TextView(this@MainActivity)
                    tv.text = pm.getApplicationLabel(apps[p])
                    tv.setPadding(24, 0, 0, 0)
                    row.addView(img)
                    row.addView(tv)
                    return row
                  }
                }
                list.setOnItemClickListener { _, _, pos, _ ->
                  val a = apps[pos]
                  bigIcon.setImageDrawable(pm.getApplicationIcon(a))
                  label.text = pm.getApplicationLabel(a).toString() + "\n" + a.packageName
                }
              }
            }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
